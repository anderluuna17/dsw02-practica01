name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate single schema source file
        working-directory: backend
        run: |
          count=$(find src/main/resources -maxdepth 1 -type f -name 'schema*.sql' | wc -l)
          echo "Found $count schema file(s) in src/main/resources"
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one schema SQL file in src/main/resources (usually schema.sql)."
            find src/main/resources -maxdepth 1 -type f -name 'schema*.sql' -print
            exit 1
          fi

      - name: Build and test backend
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test frontend
        env:
          CI: true
        run: npm --prefix frontend run test -- --watch=false
      # Cypress E2E moved to dedicated workflow: .github/workflows/cypress.yml
