name: SonarCloud PR

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

jobs:
  sonarqube:
    name: SonarCloud Scan
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].base.ref == 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests + coverage
        working-directory: backend
        run: ./mvnw -B clean verify

      - name: Frontend install
        run: npm --prefix frontend ci

      - name: Frontend tests + coverage
        env:
          CI: true
        run: npm --prefix frontend run test -- --watch=false --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}